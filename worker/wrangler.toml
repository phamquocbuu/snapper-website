name = "snapper-contact"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Set the public URL of this Worker (or a custom route) after first deploy,
# then point the site's CONTACT_ENDPOINT at it.
# routes = [{ pattern = "api.snapper.nexis.io.vn/contact", custom_domain = true }]

[vars]
ALLOWED_ORIGIN = "https://snapper.nexis.io.vn"

# Secrets (do NOT put these here) — set with wrangler:
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
